name: 썸네일 만들기

# 소식 카드의 미리보기 그림을 만든다: 재이용이 허용된 공식 출처의 원문 화면(제목 부분)과 법령 PDF의 첫 장.
# 그림이 없는 소식만 다룬다. 끝나면 '사이트 배포'가 이어서 돈다.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 한 번에 만들 그림의 수
        default: "150"

permissions:
  contents: write

concurrency:
  group: thumbs
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 만들 그림 고르기
        id: plan
        run: |
          pip install -q pillow
          mkdir -p /tmp/thumbs/raw
          python -m tools.thumbs.plan /tmp/thumbs/todo.json --limit "${{ inputs.limit || '150' }}"
          echo "count=$(python -c 'import json; print(len(json.load(open("/tmp/thumbs/todo.json"))))')" >> "$GITHUB_OUTPUT"
      - name: 원문 화면 찍기
        if: steps.plan.outputs.count != '0'
        run: |
          npm install --no-save --no-package-lock --silent puppeteer-core
          node tools/thumbs/shots.mjs /tmp/thumbs/todo.json /tmp/thumbs/raw
      - name: 법령 PDF의 첫 장 받기
        if: steps.plan.outputs.count != '0'
        run: |
          command -v pdftoppm > /dev/null || (sudo apt-get update -q > /dev/null && sudo apt-get install -y -q poppler-utils > /dev/null)
          python -m tools.thumbs.pdfcover /tmp/thumbs/todo.json /tmp/thumbs/raw
      - name: 줄여서 싣기
        if: steps.plan.outputs.count != '0'
        run: |
          python -m tools.thumbs.finish /tmp/thumbs/todo.json /tmp/thumbs/raw
          git config user.name "cbam-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/thumbs collected/thumbs
          git diff --cached --quiet || (git commit -q -m "미리보기 그림 $(TZ=Asia/Seoul date '+%F %H:%M')" && git pull -q --rebase origin main && git push -q origin HEAD:main)
