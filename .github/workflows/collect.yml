name: 출처 수집과 원문 판 점검

on:
  schedule:
    # 한국 시각 월~금 05:20. GitHub의 예약 실행은 늦게 시작하는 일이 있어(2026-11-11에는 37분 늦음), 07:05의 작성 실행 전에 끝나도록 넉넉히 앞에 둔다.
    - cron: "20 20 * * 0-4"
  workflow_dispatch:
    inputs:
      full:
        description: "원문을 모두 다시 받아 비교"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/collect.yml"
      - "tools/collect/**"
      - "tools/archive/**"
      - "tools/cn/**"
      - "tools/originals/**"
      - "tools/prices/**"
      - "tools/common/**"
      - "sources/registry.json"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 본문 추출 도구 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: 출처 수집
        run: python -m tools.collect.run
      - name: 공공기관 게시글의 본문 받기
        # 화면이 이용 조건(공공누리 1유형 등)을 밝힌 글만 받아 둔다. 실패해도 나머지 수집은 계속한다(그 글은 제목만으로 실린다).
        continue-on-error: true
        timeout-minutes: 5
        run: python -m tools.collect.articles
      - name: 규제 진행 상황에 쓰는 공식 기록 갱신
        # 유럽의회 절차, 집행위 의견수렴과 보도자료, EU 법령 데이터베이스의 연관 문서, 영국 법령, 미국 연방관보. 실패해도 나머지 수집은 계속한다.
        continue-on-error: true
        timeout-minutes: 15
        run: python -m tools.archive.crawl --budget-minutes 10 eur-lex-related eur-lex-docs ep-oeil ec-hys ec-press-recent uk-legislation uk-govuk-recent us-fedreg to-feed
      - name: 품목 코드 목록 갱신
        # CBAM 규정의 새 통합본이 위의 기록에 보일 때만 본문을 받아 목록(data/cn.json)을 다시 만든다. 없으면 아무것도 받지 않는다.
        continue-on-error: true
        timeout-minutes: 8
        run: python -m tools.cn.refresh
      - name: 인증서 가격표 읽기
        run: python -m tools.prices.run
      - name: 원문 판 점검
        run: python -m tools.originals.run ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '--full' || '' }}
      - name: 결과 올리기
        run: |
          git config user.name "cbam-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collected originals data/prices.json data/cn.json
          git diff --cached --quiet || git commit -m "수집 결과 $(TZ=Asia/Seoul date '+%F %H:%M')"
          # 올리기가 멈추면 끊고 다시 해 보고, 끝내 안 되면 이 실행이 실패로 남는다
          sh tools/dev/push.sh
