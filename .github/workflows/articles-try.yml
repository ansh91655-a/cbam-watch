name: 본문 받기 시험

# 출처를 본문 받기에 넣기 전에, 자동 실행 환경에서 그 화면이 어떻게 읽히는지 본다(이용 조건을 어디서 찾는지, 본문의 처음과 끝).
# 저장소에는 아무것도 쓰지 않고 본 것만 실행 기록에 찍는다. 손으로만 돌린다.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "'<출처 코드>=<글 주소>'를 띄어 적는다. 주소 자리에 first:<건수>@<주소에 든 글자>를 적으면 목록 화면에서 고른다"
        required: true
        type: string
      license:
        description: "(대장의 규칙 대신 시험할 때) 화면에 있어야 하는 이용 조건의 글귀"
        type: string
        default: ""
      terms_url:
        description: "(대장의 규칙 대신 시험할 때) 이용 조건을 적어 둔 화면의 주소"
        type: string
        default: ""
      stop:
        description: "(대장의 규칙 대신 시험할 때) 본문이 끝나는 자리를 알리는 글귀"
        type: string
        default: ""
      dump:
        description: "본문으로 고른 줄을 모두 찍는다"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 글을 받아 본 것 찍기
        env:
          TARGETS: ${{ inputs.targets }}
          LICENSE: ${{ inputs.license }}
          TERMS_URL: ${{ inputs.terms_url }}
          STOP: ${{ inputs.stop }}
          DUMP: ${{ inputs.dump }}
        run: |
          set -f
          set -- $TARGETS
          if [ -n "$LICENSE" ]; then set -- "$@" --license "$LICENSE"; fi
          if [ -n "$TERMS_URL" ]; then set -- "$@" --terms-url "$TERMS_URL"; fi
          if [ -n "$STOP" ]; then set -- "$@" --stop "$STOP"; fi
          if [ "$DUMP" = "true" ]; then set -- "$@" --dump; fi
          python -m tools.collect.articles_try "$@"
