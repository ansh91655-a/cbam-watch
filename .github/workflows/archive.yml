name: 소급 수집

# 지난 소식을 한꺼번에 모을 때 손으로 돌린다. 평소의 자동 실행은 이 워크플로를 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe(화면의 짜임 살펴보기), crawl(모으기), clean(살펴본 자료 가지 지우기)"
        type: choice
        options: [probe, crawl, clean]
        default: probe
      steps:
        description: "crawl일 때 돌릴 출처 이름(띄어 적는다. 비우면 모두). 예: ec-news ep-oeil. probe일 때는 대상 파일의 경로(비우면 기본 대상)"
        type: string
        default: ""

permissions:
  contents: write

# 모으기(crawl)는 평일 수집(collect.yml)과 같은 파일(collected/)을 고친다. 둘이 함께 돌면 올릴 때 부딪쳐 한쪽이 실패하므로
# 같은 줄(collect)에 세워 앞의 것이 끝난 뒤에 돈다. 줄에서 기다리는 실행은 하나뿐이다(새로 기다리는 것이 오면 앞서 기다리던 것은 취소된다).
# 여러 출처를 다시 받을 때는 한 번의 실행에 steps를 띄어 적어 함께 돌린다.
concurrency:
  group: ${{ inputs.mode == 'crawl' && 'collect' || format('archive-{0}', inputs.mode) }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 화면의 짜임 살펴보기
        if: inputs.mode == 'probe'
        env:
          TARGETS: ${{ inputs.steps }}
        run: |
          # steps 칸에 대상 파일의 경로를 적으면 그 파일의 주소들을 살펴본다(비우면 기본 대상)
          python -m tools.archive.dump $TARGETS
          git config user.name "cbam-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan archive-probe
          git rm -rq --cached .
          git add -f _dump
          git commit -qm "소급 수집 준비 자료 $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push -f origin archive-probe
      - name: 살펴본 자료 가지 지우기
        if: inputs.mode == 'clean'
        run: git push origin --delete archive-probe || echo "지울 가지가 없음"
      - name: 지난 소식 모으기
        if: inputs.mode == 'crawl'
        timeout-minutes: 40
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          pip install -q -r requirements.txt
          python -m tools.archive.crawl --budget-minutes 30 $STEPS
      - name: 모은 것 올리기
        if: always() && inputs.mode == 'crawl'
        run: |
          git config user.name "cbam-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collected/archive
          git diff --cached --quiet || git commit -m "소급 수집 결과 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
