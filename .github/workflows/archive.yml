name: 소급 수집

# 지난 소식을 한꺼번에 모을 때 손으로 돌린다. 평소의 자동 실행은 이 워크플로를 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe(화면의 짜임 살펴보기), crawl(모으기), clean(살펴본 자료 가지 지우기)"
        type: choice
        options: [probe, crawl, clean]
        default: probe
      steps:
        description: "crawl일 때 돌릴 출처 이름(띄어 적는다. 비우면 모두). 예: ec-news ep-oeil. probe일 때는 대상 파일의 경로(비우면 기본 대상)"
        type: string
        default: ""

permissions:
  contents: write

# 출처가 다른 실행은 함께 돌 수 있다(같은 출처를 두 번 돌리면 뒤의 것이 기다린다).
concurrency:
  group: archive-${{ inputs.mode }}-${{ inputs.steps }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 화면의 짜임 살펴보기
        if: inputs.mode == 'probe'
        env:
          TARGETS: ${{ inputs.steps }}
        run: |
          # steps 칸에 대상 파일의 경로를 적으면 그 파일의 주소들을 살펴본다(비우면 기본 대상)
          python -m tools.archive.dump $TARGETS
          git config user.name "cbam-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan archive-probe
          git rm -rq --cached .
          git add -f _dump
          git commit -qm "소급 수집 준비 자료 $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push -f origin archive-probe
      - name: 살펴본 자료 가지 지우기
        if: inputs.mode == 'clean'
        run: git push origin --delete archive-probe || echo "지울 가지가 없음"
      - name: 지난 소식 모으기
        if: inputs.mode == 'crawl'
        timeout-minutes: 40
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          pip install -q pypdf pdfplumber
          python -m tools.archive.crawl --budget-minutes 30 $STEPS
      - name: 모은 것 올리기
        if: always() && inputs.mode == 'crawl'
        run: |
          git config user.name "cbam-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collected/archive
          git diff --cached --quiet || git commit -m "소급 수집 결과 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
