name: 도구 검사

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
      # 시험이 직접 읽는 화면의 셈, 운영 콘솔의 상태 규칙, 법령에서 옮겨 온 참고 자료
      - "site/js/calc/**"
      - "site/js/cn/**"
      - "console/js/state.js"
      - "data/calc.json"
      - "data/calc-goods.json"
      - "data/factor.json"
      - "data/duties.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 자동 시험
        run: |
          pip install -q -r requirements.txt
          python -m unittest discover -s tests -t .
