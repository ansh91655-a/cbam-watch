name: 도구 검사

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
      # 시험이 직접 읽는 화면의 셈, 운영 콘솔(상태 규칙과, 콘솔이 복사해 쓰는 사이트의 화면 도우미), 법령에서 옮겨 온 참고 자료
      - "site/js/calc/**"
      - "site/js/cn/**"
      - "console/**"
      - "site/js/ui/dom.js"
      - "site/js/ui/format.js"
      - "data/calc.json"
      - "data/calc-goods.json"
      - "data/factor.json"
      - "data/duties.json"
      # 규정 원문: 화면의 찾기, 번역 자료와 그 검사가 따르는 용어집.
      # 번역(data/laws-ko)은 실행 하나가 묶음마다 올리므로 그 커밋마다 돌지 않는다(넣을 때 이미 검사를 거친다: tools/laws/apply.py, verify.py).
      # 번역이나 검수 실행이 끝나며 표(stamps/translated.json)를 고칠 때 한 번 돈다. 사이트 배포와 화면 점검도 같은 표를 본다.
      - "site/js/laws/**"
      - "sources/guides.json"
      - "sources/translation.json"
      - "stamps/**"
      - "language/glossary.json"
      # 화면에 적는 이름과 주소를 다루는 화면 모듈, 출처의 화면용 이름
      - "site/js/nav/**"
      - "site/js/news/**"
      - "site/js/rules/**"
      - "site/js/router.js"
      - "site/404.html"
      - "sources/labels.json"
      - "data/regulations.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 자동 시험
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils   # PDF를 읽는 시험(tests/test_units)이 pdftotext를 쓴다
          pip install -q -r requirements.txt
          python -m unittest discover -s tests -t .
