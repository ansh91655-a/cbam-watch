name: 도구 검사

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 자동 시험
        run: python -m unittest discover -s tests -t .
