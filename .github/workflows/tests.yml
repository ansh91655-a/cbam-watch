name: 도구 검사

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
      # 시험이 직접 읽는 화면의 셈, 운영 콘솔(상태 규칙과, 콘솔이 복사해 쓰는 사이트의 화면 도우미), 법령에서 옮겨 온 참고 자료
      - "site/js/calc/**"
      - "site/js/cn/**"
      - "console/**"
      - "site/js/ui/dom.js"
      - "site/js/ui/format.js"
      - "data/calc.json"
      - "data/calc-goods.json"
      - "data/factor.json"
      - "data/duties.json"
      # 규정 원문: 화면의 찾기, 번역 자료와 그 검사가 따르는 용어집
      - "site/js/laws/**"
      - "sources/guides.json"
      - "sources/translation.json"
      - "data/laws-ko/**"
      - "language/glossary.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 자동 시험
        run: |
          pip install -q -r requirements.txt
          python -m unittest discover -s tests -t .
