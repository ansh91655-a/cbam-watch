name: 사이트 배포

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "tools/publish/**"
      - "deploy.json"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["출처 수집과 원문 판 점검", "썸네일 만들기"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사이트 폴더 만들기
        run: python -m tools.publish.build_site _site
      - name: 배포 가지에 올리기
        env:
          # 사이트만 싣는 공개 저장소를 따로 둘 때: 저장소 이름은 deploy.json의 siteRepo(또는 저장소 변수 SITE_REPO)에,
          # 그 저장소에 올리는 토큰은 비밀값 SITE_TOKEN에 둔다. 둘 가운데 하나라도 없으면 이 저장소의 gh-pages로 올린다.
          SITE_REPO: ${{ vars.SITE_REPO }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          if [ -z "$SITE_REPO" ]; then SITE_REPO="$(python -c "from tools.common.siteinfo import site_repo; print(site_repo())")"; fi
          cd _site
          git init -q -b gh-pages
          git config user.name "cbam-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "사이트 배포 $(TZ=Asia/Seoul date '+%F %H:%M')"
          # 올리기가 멈추면 끊고 다시 해 본다(tools/dev/push.sh)
          if [ -n "$SITE_REPO" ] && [ -n "$SITE_TOKEN" ]; then
            sh "$GITHUB_WORKSPACE/tools/dev/push.sh" --force "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}" gh-pages
          else
            sh "$GITHUB_WORKSPACE/tools/dev/push.sh" --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
          fi
