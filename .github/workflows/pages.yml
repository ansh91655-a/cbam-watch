name: 사이트 배포

# 번역(data/laws-ko)은 실행 하나가 묶음마다 올리므로 그 커밋마다 싣지 않는다. 번역 실행이 끝나며 표(stamps/translated.json)를
# 고치면 그때 한 번 싣는다(tools/laws/lock.py). GitHub Pages는 한 시간에 열 번까지만 다시 싣는 것을 권한다.
# 틀려서 지운 번역(language/translation-reviews.json이 바뀜)은 기다리지 않고 바로 싣는다.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "!data/laws-ko/**"
      - "stamps/**"
      - "language/translation-reviews.json"
      - "tools/publish/**"
      - "tools/laws/**"
      - "tools/pdfko/**"
      - "originals/units/**"
      - "language/glossary.json"
      - "sources/guides.json"
      - "deploy.json"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["출처 수집과 원문 판 점검", "썸네일 만들기"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 국문 PDF를 만드는 도구 설치
        # 원문과 같은 자리에 번역을 앉힌 PDF를 만드는 데 쓴다(tools/pdfko). 설치가 안 되어도 사이트는 싣는다(PDF 나란히 보기만 빠진다).
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q -r requirements.txt
      - name: 만들어 둔 국문 PDF 가져오기
        # 입력(원문, 단위, 번역, 만드는 프로그램, 글꼴)이 같은 문서는 다시 만들지 않는다(tools/pdfko/site.py)
        uses: actions/cache@v4
        with:
          path: .cache/pdfko
          key: pdfko-${{ hashFiles('data/laws-ko/**', 'originals/units/**', 'originals/state.json', 'sources/guides.json', 'tools/pdfko/**', 'assets/fonts/**') }}
          restore-keys: pdfko-
      - name: 사이트 폴더 만들기
        run: python -m tools.publish.build_site _site
      - name: 배포 가지에 올리기
        env:
          # 사이트만 싣는 공개 저장소를 따로 둘 때: 저장소 이름은 deploy.json의 siteRepo(또는 저장소 변수 SITE_REPO)에,
          # 그 저장소에 올리는 토큰은 비밀값 SITE_TOKEN에 둔다. 둘 가운데 하나라도 없으면 이 저장소의 gh-pages로 올린다.
          SITE_REPO: ${{ vars.SITE_REPO }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          if [ -z "$SITE_REPO" ]; then SITE_REPO="$(python -c "from tools.common.siteinfo import site_repo; print(site_repo())")"; fi
          if [ -n "$SITE_REPO" ] && [ -n "$SITE_TOKEN" ]; then
            TARGET="https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}"
          else
            TARGET="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          fi
          cd _site
          git init -q -b gh-pages
          git config user.name "cbam-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 지난 배포의 목록만 받아 둔다(파일 내용은 받지 않는다). 그러면 바뀌지 않은 파일(문서 사본과 PDF 140MB쯤)은 다시 올리지 않는다.
          # 받지 못해도 그대로 간다(그때는 모두 올린다). 배포 가지는 전과 같이 커밋 하나로 덮어쓴다.
          git remote add origin "$TARGET"
          timeout 60 git fetch -q --depth=1 --filter=blob:none origin gh-pages || echo "지난 배포를 받지 못해 모두 올립니다."
          git add -A
          git commit -q -m "사이트 배포 $(TZ=Asia/Seoul date '+%F %H:%M')"
          # 올리기가 멈추면 끊고 다시 해 본다(tools/dev/push.sh)
          PUSH_LIMIT=300 sh "$GITHUB_WORKSPACE/tools/dev/push.sh" --force "$TARGET" gh-pages
