name: 출처 접속 점검

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe.yml"
      - "tools/probe/**"

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 본문 추출 도구 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: 점검 실행
        run: python -m tools.probe.probe
      - name: 결과 올리기
        run: |
          git config user.name "cbam-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add originals/_probe
          git diff --cached --quiet || git commit -m "출처 접속 점검 결과"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
