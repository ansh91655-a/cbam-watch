<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공유 미리보기 그림</title>
<!--
  링크를 공유할 때 뜨는 미리보기 그림(site/assets/og.jpg)의 원본이다. 크기는 1200x630.
  고칠 때만 쓴다: 저장소 맨 위에서 `python3 -m http.server`를 띄우고 /tools/art/social.html 을 1200x630 창으로 열어 화면 그림을 찍어 site/assets/og.jpg 로 저장한다(JPEG, 품질 90).
  사이트의 색(tokens.css)과 점 지도(heromap.js)를 그대로 가져다 쓰므로 사이트와 같은 모습이 된다. 바뀌는 값(가격, 날짜)은 넣지 않는다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/site/css/tokens.css">
<link rel="stylesheet" href="/site/css/layout.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: var(--font); color: #ffffff; background: var(--hero-bg); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .frame { position: relative; width: 1200px; height: 630px; padding: 64px 72px; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr auto; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .brand svg { width: 52px; height: 52px; }
  h1 { align-self: center; margin: 0; font-size: 76px; font-weight: 800; line-height: 1.16; letter-spacing: -0.035em; }
  h1 span { background: linear-gradient(90deg, #ffcc00, #ffe58a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { margin: 22px 0 0; font-size: 27px; font-weight: 500; line-height: 1.5; letter-spacing: -0.01em; color: var(--on-deep-2); max-width: 640px; }
  .foot { font-size: 21px; color: var(--on-deep-3); }
  .art { position: absolute; top: 96px; right: -150px; width: 820px; aspect-ratio: 1117 / 488; -webkit-mask-image: linear-gradient(90deg, transparent, #000 16%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 16%, #000 86%, transparent); }
  .art .map { display: block; width: 100%; height: 100%; overflow: visible; }
  .art .map-arc { animation: none; stroke-dashoffset: 0; }
  .copy { position: relative; z-index: 1; align-self: center; }
</style>
</head>
<body>
<div class="frame">
  <div class="brand">
    <svg viewBox="0 0 30 30" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b59e0"/><stop offset="1" stop-color="#003399"/></linearGradient></defs>
      <rect width="30" height="30" rx="8" fill="url(#g)"/>
      <path d="M19.5 6.5v17" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.4 3.5"/>
      <path d="M14 15h10.5" fill="none" stroke="#ffcc00" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="10.5" cy="15" r="4.2" fill="#ffcc00"/>
    </svg>
    <span>CBAM 규제동향</span>
  </div>
  <div id="art"></div>
  <div class="copy">
    <h1>CBAM 규제,<br><span>달라진 것</span>부터 봅니다</h1>
    <p class="lead">EU 탄소국경조정제도의 법령, 가이던스, 인증서 가격, 일정을 원문과 함께 국문으로 정리합니다.</p>
  </div>
  <div class="foot">개인이 운영하는 비공식 사이트</div>
</div>
<script type="module">
  import { heroMap } from "/site/js/ui/heromap.js";
  const art = heroMap();
  art.className = "art";
  document.getElementById("art").replaceWith(art);
</script>
</body>
</html>
