<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050b24">
<title>찾는 주소가 없습니다 - CBAM 규제동향</title>
<link rel="icon" type="image/svg+xml" href="https://ansh91655-a.github.io/cbam-watch/assets/favicon.svg">
<!-- 사이트에 없는 경로(/cbam-watch/아무 이름)로 왔을 때 GitHub Pages가 보여 주는 화면이다. 어느 깊이의 경로에서도 열리므로
     링크는 사이트의 온전한 주소로 적고(site.config.json의 url과 같아야 한다: tests/test_missing.py), 모양은 이 파일 안에 둔다. -->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(120deg, #050b24, #0a1540 60%, #0f1f5c); color: #0b1230;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; line-height: 1.6; word-break: keep-all; }
  main { width: min(560px, 100%); padding: 36px 32px 32px; border-radius: 20px; background: #ffffff; box-shadow: 0 24px 60px rgba(5, 11, 36, 0.35); }
  .site { margin: 0 0 18px; font-size: 0.9rem; font-weight: 700; color: #003399; }
  h1 { margin: 0 0 10px; font-size: 1.7rem; line-height: 1.3; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: #3f486a; }
  ul { margin: 0 0 22px; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  li a { display: block; padding: 11px 14px; border: 1px solid #d8deee; border-radius: 12px; color: #0b1230; text-decoration: none; font-weight: 600; }
  li a:hover, li a:focus-visible { border-color: #2b59e0; background: #eaf0ff; }
  .main { display: inline-block; padding: 12px 20px; border-radius: 999px; background: #003399; color: #ffffff; text-decoration: none; font-weight: 700; }
  .main:hover, .main:focus-visible { background: #00267a; }
  a:focus-visible { outline: 3px solid #f0b400; outline-offset: 2px; }
  .note { margin: 22px 0 0; font-size: 0.85rem; color: #5d6787; }
</style>
</head>
<body>
<main>
  <p class="site">CBAM 규제동향</p>
  <h1>찾는 주소가 없습니다</h1>
  <p>주소가 바뀌었거나 잘못 적힌 주소입니다. 아래에서 다시 찾아 주세요.</p>
  <ul>
    <li><a href="https://ansh91655-a.github.io/cbam-watch/#news">소식</a></li>
    <li><a href="https://ansh91655-a.github.io/cbam-watch/#rules">규제</a></li>
    <li><a href="https://ansh91655-a.github.io/cbam-watch/#calendar">일정</a></li>
    <li><a href="https://ansh91655-a.github.io/cbam-watch/#cn">품목 코드 조회</a></li>
    <li><a href="https://ansh91655-a.github.io/cbam-watch/#handbook">CBAM 해설서</a></li>
    <li><a href="https://ansh91655-a.github.io/cbam-watch/#laws">규정 원문</a></li>
    <li><a href="https://ansh91655-a.github.io/cbam-watch/#terms">용어집</a></li>
    <li><a href="https://ansh91655-a.github.io/cbam-watch/#search">검색</a></li>
  </ul>
  <a class="main" id="home" href="https://ansh91655-a.github.io/cbam-watch/">첫 화면으로 가기</a>
  <p class="note">개인이 운영하는 비공식 사이트입니다. 유럽연합(EU)과 그 기관의 공식 사이트가 아닙니다.</p>
</main>
<script>
  // 경로가 화면의 이름처럼 생겼으면(/cbam-watch/rules, /cbam-watch/terms.html) 사이트의 그 주소(#rules)로 보낸다.
  // 그런 화면이 없으면 사이트가 찾으려던 화면을 어림해 안내한다. 그 밖의 경로는 이 화면에 그대로 둔다.
  (function () {
    var home = document.getElementById("home").href;
    var base = new URL(home).pathname;
    var rest = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : "";
    var name = rest.replace(/\/+$/, "").replace(/\.html?$/i, "");
    if (/^[A-Za-z][A-Za-z0-9.-]{1,60}$/.test(name) && name.toLowerCase() !== "404") location.replace(home + "#" + name);
  })();
</script>
</body>
</html>
